[project]
name = "bitcap-ipr"
version = "1.5.2"
description = "Cross-platform IP reporter that listens for AntMiner, IceRiver, and Whatsminer ASICs."
authors = [{ name = "MatthewWertman", email = "matt@bitcap.co" }]
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pyside6 (>=6.10.2,<7.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "platformdirs (>=4.9.4,<5.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pyobjc-framework-Cocoa (>=10.0) ; sys_platform == 'darwin'",
    "httpx (>=0.28.1,<0.29.0)",
    "qasync (>=0.27.1,<0.28.0)",
    "zeroconf (>=0.150.0,<0.151.0)"
]

[project.urls]
Homepage = "https://www.bitcap.co"
Repository = "https://github.com/bitcap-co/bitcap-ipr"
Issues = "https://github.com/bitcap-co/bitcap-ipr/issues"

[tool.bitcap-ipr]
display-name = "BitCap IPReporter"
executable-name = "BitCapIPR"
app-author = "BitCap"
company-name = "Bit Capital Group"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
scapy = "^2.7.0"
nuitka = "^4.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
