name: Build and Release BitCap IPReporter

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform-tag: ubuntu-22.04-x64
          - os: ubuntu-24.04
            platform-tag: ubuntu-24.04-x64
          - os: macos-15-intel
            platform-tag: macos-x64
          - os: macos-latest
            platform-tag: macos-arm64
          - os: windows-latest
            platform-tag: win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry==2.2.1

      - name: Install locked dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with dev --no-interaction --no-root

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ccache libegl1 patchelf zip

      - name: Remove problematic Homebrew OpenSSL libraries
        if: matrix.os == 'macos-15-intel'
        run: |
          brew remove --force --ignore-dependencies openssl@3
          brew cleanup openssl@3

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Verify generated metadata
        run: poetry run python tools/project_metadata.py --check

      - name: Build tagged release
        if: github.ref_type == 'tag'
        run: >-
          poetry run python tools/build_app.py
          --platform-tag "${{ matrix.platform-tag }}"
          --expected-version "${{ github.ref_name }}"

      - name: Build manual release
        if: github.ref_type != 'tag'
        run: >-
          poetry run python tools/build_app.py
          --platform-tag "${{ matrix.platform-tag }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform-tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*-setup.exe
            dist/nuitka-report.xml

  release:
    name: Create draft release
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          name: BitCap IPReporter ${{ github.ref_name }} Release
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rp-') }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*-setup.exe
