name: Test BitCap IPReporter

on:
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "Makefile"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "Makefile"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip poetry==2.2.1
          poetry config virtualenvs.create false
          poetry install --with dev --no-interaction --no-root

      - name: Verify generated metadata
        run: poetry run python tools/project_metadata.py --check

      - name: Run unit tests
        working-directory: src
        run: poetry run python -m unittest discover tests/
